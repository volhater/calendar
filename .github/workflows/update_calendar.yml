name: Scrape WKU Academic Calendar

on:
  schedule:
    # Runs automatically every Sunday at midnight UTC (00:00)
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows you to trigger the job manually from the GitHub UI anytime

permissions:
  contents: write # Grants permission to commit the generated .ics file back to the repo

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 icalendar python-dateutil

      - name: Run Scraper Script
        run: |
          python wku_calendar_scraper.py

      - name: Commit and Push Updated Calendar
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add wku_academic_calendar.ics
          
          # Only commit if the calendar file actually changed
          if git diff --staged --quiet; then
            echo "No changes detected in academic calendar."
          else
            git commit -m "Automated update: WKU Academic Calendar .ics"
            git push
          fi
