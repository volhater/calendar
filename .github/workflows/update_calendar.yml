name: Scrape & Deploy Calendar to GitHub Pages

on:
  schedule:
    # Runs automatically every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: read
  pages: write      # Required to deploy to GitHub Pages
  id-token: write   # Required for GitHub Pages OIDC deployment authentication

# Allow only one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  scrape-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 icalendar python-dateutil

      - name: Run Scraper Script
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          python wku_calendar_scraper.py

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Site Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site' # Uploads the site/ directory created by python script

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
